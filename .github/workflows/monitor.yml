name: monitor-stock

# Chequeo completo (ficha + SAP con browser) cada 10 minutos.
# Avisa por Telegram SOLO ante transición a stock real (ver last_state.json).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: last_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Run monitor (once)
        env:
          MONITOR_CLOUD: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 monitor.py --once --no-open

      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_state.json
          key: stock-state-${{ github.run_id }}
